<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cogit — Test serveur</title><style>body{font:17px system-ui;max-width:680px;margin:50px auto;padding:20px;background:#f6f7fa;color:#20232b}button{padding:12px 18px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:20px;border:1px solid #ddd;border-radius:8px}</style><h1>Cogit — Test serveur</h1><p>Ce test envoie une ligne TEST-001 dans l’onglet Joueurs et vérifie la réponse du serveur.</p><button id="go">Envoyer le test</button><pre id="out">En attente.</pre><script>const url='https://script.google.com/macros/s/AKfycbwmbos5UzSjzL3d6PPhudY-3FKPAlkZiJjw2L5X4mV6Xt73CJSj0L88ng9uymR_bl4fPw/exec';const go=document.getElementById('go'),out=document.getElementById('out');go.onclick=async()=>{go.disabled=true;out.textContent='Envoi en cours…';try{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'test'}),credentials:'omit',redirect:'follow'});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{throw new Error('Réponse non JSON : '+raw.slice(0,300))}out.textContent=(r.ok&&data.success===true?'Confirmation reçue : succès':'Échec signalé par le serveur')+'\nHTTP '+r.status+'\n'+JSON.stringify(data,null,2)}catch(e){out.textContent='Confirmation non reçue : '+e.message+'\nVérifie tout de même l’onglet Joueurs : une écriture peut avoir eu lieu.'}finally{go.disabled=false}};</script></html>
